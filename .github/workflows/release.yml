name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: zeroclash-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: zeroclash-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: zeroclash-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zeroclash-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libappindicator3-dev

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz zeroclash zeroclash-cli

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }}.zip zeroclash.exe zeroclash-cli.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8

      - name: Generate changelog
        run: |
          git log --pretty=format:'- %s' $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD > CHANGELOG.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            zeroclash-linux-amd64/zeroclash-linux-amd64.tar.gz
            zeroclash-macos-amd64/zeroclash-macos-amd64.tar.gz
            zeroclash-macos-arm64/zeroclash-macos-arm64.tar.gz
            zeroclash-windows-amd64.exe/zeroclash-windows-amd64.exe.zip
